<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OmniFlow 財務管理系統</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OmniFlow">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-500 selection:text-white pb-20">

  <!-- 頂部導航 -->
  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200 safe-top">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-brand-500 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-base font-bold text-slate-900 leading-none">OmniFlow</h1>
            <span id="sync-status-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200 font-medium">離線模式</span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">全自動雲端同步與開支歸因儀</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button onclick="openAuthModal()" id="auth-btn" class="px-3 py-2 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-shield-halved text-brand-600"></i>
          <span id="auth-btn-label">雲端連線 / 登入</span>
        </button>
        <button onclick="openModal()" class="px-3.5 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-500 rounded-lg shadow-sm transition flex items-center space-x-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>記帳</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-6">
    
    <!-- 頂部數據看板 -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <span class="text-xs text-slate-500 font-medium">本月總開支</span>
        <div class="text-xl sm:text-2xl font-bold text-slate-900 mt-1" id="kpi-current-month">HK$ 0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <span class="text-xs text-slate-500 font-medium">情境對象佔比</span>
        <div class="text-xl sm:text-2xl font-bold text-rose-600 mt-1" id="kpi-gf-percentage">0%</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <span class="text-xs text-slate-500 font-medium">資料庫同步狀態</span>
        <div class="text-sm font-semibold text-slate-800 mt-2 truncate" id="kpi-cloud-status">未連接雲端</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <span class="text-xs text-slate-500 font-medium">已同步筆數</span>
        <div class="text-xl sm:text-2xl font-bold text-slate-900 mt-1" id="kpi-total-records">0 筆</div>
      </div>
    </section>

    <!-- 視覺化分析圖表 -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-2 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-bold text-slate-900 flex items-center space-x-2">
            <i class="fa-solid fa-chart-column text-brand-600"></i>
            <span>月度開支走勢分析</span>
          </h2>
          <span class="text-xs text-slate-500">自動雲端彙整</span>
        </div>
        <div class="h-64">
          <canvas id="monthlyChart"></canvas>
        </div>
      </div>
      
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-bold text-slate-900 flex items-center space-x-2">
            <i class="fa-solid fa-chart-pie text-brand-600"></i>
            <span>情境對象分佈</span>
          </h2>
          <span class="text-xs text-slate-500">全期統計</span>
        </div>
        <div class="h-64 flex items-center justify-center">
          <canvas id="tagChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 開支歸因深入診斷 -->
    <section class="bg-slate-900 text-slate-100 p-5 rounded-2xl shadow-sm">
      <div class="flex items-center space-x-2 mb-3">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
        <h2 class="text-sm font-bold tracking-wide uppercase text-slate-300">月度開支波動診斷儀</h2>
      </div>
      <div id="attribution-analysis" class="text-sm leading-relaxed text-slate-300">
        正在載入財務資料庫...
      </div>
    </section>

    <!-- 交易明細列表 -->
    <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
      <div class="p-5 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-base font-bold text-slate-900">消費明細紀錄</h2>
          <p class="text-xs text-slate-500 mt-0.5">自動同步於所有已授權裝置</p>
        </div>
        
        <div class="flex items-center space-x-2">
          <select id="filter-tag" onchange="renderDashboard()" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-600 focus:outline-none focus:ring-1 focus:ring-brand-500">
            <option value="ALL">全部對象標籤</option>
            <option value="女朋友拍拖">女朋友拍拖</option>
            <option value="朋友聚餐">朋友聚餐</option>
            <option value="個人獨處">個人獨處</option>
            <option value="家庭長輩">家庭長輩</option>
            <option value="商務工作">商務工作</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50/75 border-b border-slate-200 text-xs text-slate-500">
              <th class="py-3 px-4 font-semibold">日期</th>
              <th class="py-3 px-4 font-semibold">科目分類</th>
              <th class="py-3 px-4 font-semibold">對象標籤</th>
              <th class="py-3 px-4 font-semibold">描述備註</th>
              <th class="py-3 px-4 font-semibold">記錄終端</th>
              <th class="py-3 px-4 font-semibold text-right">金額 (HK$)</th>
              <th class="py-3 px-4 font-semibold text-center">操作</th>
            </tr>
          </thead>
          <tbody id="transaction-table-body" class="divide-y divide-slate-100">
            <!-- 動態注入明細 -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- 記帳彈窗 Modal -->
  <div id="expense-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-base font-bold text-slate-900">記錄一筆開支</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="p-6 space-y-4 overflow-y-auto">
        <!-- AI 語意速記 -->
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
          <label class="block text-xs font-semibold text-slate-700 mb-1 flex items-center justify-between">
            <span>✨ AI 跨語言語意速記</span>
            <span class="text-[10px] text-slate-500">自動分拆科目與情境</span>
          </label>
          <div class="flex space-x-2">
            <input type="text" id="ai-input" placeholder="例如：同女朋友食居酒屋 $650 / Taxi home 90" class="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <button type="button" onclick="parseNaturalLanguage()" class="px-3 py-2 bg-slate-900 text-white rounded-lg text-xs font-medium hover:bg-slate-800 transition">剖析</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">金額 (HK$)</label>
          <input type="number" id="form-amount" step="0.1" placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-semibold text-slate-700">支出科目分類</label>
            <button type="button" onclick="promptNewCategory()" class="text-[11px] text-brand-600 font-medium hover:underline">+ 新增自訂科目</button>
          </div>
          <div id="category-selector-container" class="grid grid-cols-3 gap-2">
            <!-- 動態生成科目 -->
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">對象與情境標籤</label>
          <div id="tag-selector-container" class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectTag('女朋友拍拖')" class="tag-btn border border-slate-200 rounded-lg py-2 px-2 text-xs font-medium text-slate-700 hover:bg-slate-50 text-center" data-val="女朋友拍拖">❤️ 女朋友拍拖</button>
            <button type="button" onclick="selectTag('朋友聚餐')" class="tag-btn border border-slate-200 rounded-lg py-2 px-2 text-xs font-medium text-slate-700 hover:bg-slate-50 text-center" data-val="朋友聚餐">🍻 朋友聚餐</button>
            <button type="button" onclick="selectTag('個人獨處')" class="tag-btn border border-slate-200 rounded-lg py-2 px-2 text-xs font-medium text-slate-700 hover:bg-slate-50 text-center" data-val="個人獨處">☕ 個人獨處</button>
            <button type="button" onclick="selectTag('家庭長輩')" class="tag-btn border border-slate-200 rounded-lg py-2 px-2 text-xs font-medium text-slate-700 hover:bg-slate-50 text-center" data-val="家庭長輩">🏠 家庭長輩</button>
            <button type="button" onclick="selectTag('商務工作')" class="tag-btn border border-slate-200 rounded-lg py-2 px-2 text-xs font-medium text-slate-700 hover:bg-slate-50 text-center" data-val="商務工作">💼 商務工作</button>
            <button type="button" onclick="selectTag('自訂專案')" class="tag-btn border border-slate-200 rounded-lg py-2 px-2 text-xs font-medium text-slate-700 hover:bg-slate-50 text-center" data-val="自訂專案">🏷️ 自訂標籤</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">日期</label>
            <input type="date" id="form-date" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">描述備註</label>
            <input type="text" id="form-note" placeholder="例如：中環牛扒晚餐" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
          </div>
        </div>
      </div>

      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end space-x-3">
        <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:text-slate-800">取消</button>
        <button type="button" onclick="saveExpense()" class="px-5 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-500 rounded-lg shadow-sm transition">儲存並自動同步</button>
      </div>
    </div>
  </div>

  <!-- 雲端連線與帳號防護 Modal -->
  <div id="auth-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-base font-bold text-slate-900 flex items-center space-x-2">
          <i class="fa-solid fa-lock text-brand-600"></i>
          <span>雲端同步與個人私隱安全鎖</span>
        </h3>
        <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="p-6 space-y-4">
        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-xs text-emerald-800 leading-relaxed">
          <strong>私隱機制</strong>：透過個人密碼解鎖後，手機與電腦將自動在背景即時同步資料。任何無密碼之外人均無法存取您的財務紀錄。
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Supabase 專案網址 (Project URL)</label>
            <input type="text" id="cfg-supabase-url" placeholder="https://xxxxxxxx.supabase.co" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Supabase 匿名金鑰 (Anon Key)</label>
            <input type="password" id="cfg-supabase-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
          </div>
          <button type="button" onclick="saveCloudConfig()" class="w-full py-2 bg-slate-800 text-white rounded-lg text-xs font-medium hover:bg-slate-700 transition">儲存雲端資料庫設定</button>
        </div>

        <div class="pt-4 border-t border-slate-100 space-y-3">
          <h4 class="text-xs font-bold text-slate-900 uppercase tracking-wider">個人專屬帳號與密碼</h4>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">電郵信箱 (Email)</label>
            <input type="email" id="auth-email" placeholder="your-email@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">私隱密碼 (Password)</label>
            <input type="password" id="auth-password" placeholder="請輸入安全密碼" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
          </div>

          <div class="grid grid-cols-2 gap-2 pt-2">
            <button type="button" onclick="handleAuth('login')" class="py-2.5 px-3 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-lg transition text-center shadow-sm">登入並解鎖資料</button>
            <button type="button" onclick="handleAuth('signup')" class="py-2.5 px-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-lg transition text-center">註冊為唯一用戶</button>
          </div>
          <div id="auth-feedback" class="text-xs text-center text-slate-500 min-h-[1rem]"></div>
        </div>
      </div>

      <div class="px-6 py-3 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
        <button onclick="handleLogout()" id="logout-btn" class="text-xs text-rose-600 hover:underline hidden">登出並鎖定帳目</button>
        <button onclick="closeAuthModal()" class="px-4 py-1.5 text-xs font-medium text-slate-600 hover:text-slate-800 ml-auto">關閉</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_CATEGORIES = ['餐飲', '交通', '旅遊', '娛樂', '居住', '購物', '雜項'];
    let expenses = [];
    let categories = [...DEFAULT_CATEGORIES];
    let selectedCategory = '餐飲';
    let selectedTag = '女朋友拍拖';
    let monthlyChart = null;
    let tagChart = null;
    let supabaseClient = null;
    let currentUser = null;

    function getDeviceType() {
      return /android|iphone|ipad|ipod/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    }

    // 初始化系統
    async function initSystem() {
      // 讀取設定
      const savedUrl = localStorage.getItem('omniflow_sb_url');
      const savedKey = localStorage.getItem('omniflow_sb_key');
      if (savedUrl && savedKey) {
        document.getElementById('cfg-supabase-url').value = savedUrl;
        document.getElementById('cfg-supabase-key').value = savedKey;
        try {
          supabaseClient = supabase.createClient(savedUrl, savedKey);
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session && session.user) {
            currentUser = session.user;
            setSyncStatus(true, currentUser.email);
            await fetchExpensesFromCloud();
            return;
          }
        } catch (e) {
          console.error('Supabase 初始化錯誤:', e);
        }
      }

      // 未連接雲端時的本地降級載入
      const savedExpenses = localStorage.getItem('omniflow_expenses');
      expenses = savedExpenses ? JSON.parse(savedExpenses) : [];
      setSyncStatus(false);
      renderCategoryButtons();
      renderDashboard();
    }

    function setSyncStatus(isCloud, email = '') {
      const badge = document.getElementById('sync-status-badge');
      const kpiStatus = document.getElementById('kpi-cloud-status');
      const authBtnLabel = document.getElementById('auth-btn-label');
      const logoutBtn = document.getElementById('logout-btn');

      if (isCloud) {
        badge.className = 'text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300 font-semibold';
        badge.innerText = '雲端即時同步中';
        kpiStatus.innerHTML = `<span class="text-emerald-600 flex items-center space-x-1"><i class="fa-solid fa-cloud"></i> <span>已連線 (${email.split('@')[0]})</span></span>`;
        authBtnLabel.innerText = '帳號安全中心';
        logoutBtn.classList.remove('hidden');
      } else {
        badge.className = 'text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200 font-medium';
        badge.innerText = '本地離線模式';
        kpiStatus.innerHTML = '<span class="text-amber-600">未連線 (僅限本機)</span>';
        authBtnLabel.innerText = '雲端連線 / 登入';
        logoutBtn.classList.add('hidden');
      }
    }

    // 儲存 Supabase 連線憑證
    function saveCloudConfig() {
      const url = document.getElementById('cfg-supabase-url').value.trim();
      const key = document.getElementById('cfg-supabase-key').value.trim();
      if (!url || !key) {
        alert('請填妥 Supabase 專案網址與匿名金鑰。');
        return;
      }
      localStorage.setItem('omniflow_sb_url', url);
      localStorage.setItem('omniflow_sb_key', key);
      supabaseClient = supabase.createClient(url, key);
      alert('雲端資料庫設定已儲存！現在請直接在下方登入或註冊您的專屬帳號。');
    }

    // 帳號密碼驗證
    async function handleAuth(type) {
      if (!supabaseClient) {
        alert('請先在上方填寫並儲存 Supabase 專案網址與金鑰。');
        return;
      }
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const feedback = document.getElementById('auth-feedback');

      if (!email || !password) {
        feedback.innerText = '請輸入完整的電郵與密碼。';
        return;
      }

      feedback.innerText = '正在驗證身分...';

      if (type === 'signup') {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) {
          feedback.innerText = `註冊失敗：${error.message}`;
        } else {
          feedback.innerText = '註冊成功！若有確認信請查收，或嘗試直接點擊登入。';
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          feedback.innerText = `登入失敗：${error.message}`;
        } else {
          currentUser = data.user;
          setSyncStatus(true, currentUser.email);
          feedback.innerText = '登入成功，正在同步雲端總帳...';
          await fetchExpensesFromCloud();
          closeAuthModal();
        }
      }
    }

    async function handleLogout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      currentUser = null;
      expenses = [];
      setSyncStatus(false);
      renderDashboard();
      closeAuthModal();
      alert('已安全登出。帳目資料已自螢幕清除，需重新輸入密碼方可存取。');
    }

    // 從雲端抓取收支紀錄
    async function fetchExpensesFromCloud() {
      if (!supabaseClient || !currentUser) return;
      const { data, error } = await supabaseClient
        .from('expenses')
        .select('*')
        .order('date', { ascending: false });

      if (error) {
        console.error('抓取雲端紀錄失敗:', error);
        return;
      }

      expenses = data || [];
      renderCategoryButtons();
      renderDashboard();
    }

    // 渲染科目按鈕
    function renderCategoryButtons() {
      const container = document.getElementById('category-selector-container');
      container.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `cat-btn border border-slate-200 rounded-lg py-2 px-2 text-xs font-medium text-slate-700 hover:bg-slate-50 transition text-center truncate ${selectedCategory === cat ? 'bg-brand-500 text-white border-brand-500 font-bold' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => { selectedCategory = cat; renderCategoryButtons(); };
        container.appendChild(btn);
      });
    }

    function selectTag(tag) {
      selectedTag = tag;
      document.querySelectorAll('.tag-btn').forEach(btn => {
        if (btn.getAttribute('data-val') === tag) {
          btn.className = 'tag-btn border border-brand-500 bg-brand-500 text-white rounded-lg py-2 px-2 text-xs font-bold text-center';
        } else {
          btn.className = 'tag-btn border border-slate-200 rounded-lg py-2 px-2 text-xs font-medium text-slate-700 hover:bg-slate-50 text-center';
        }
      });
    }

    function promptNewCategory() {
      const name = prompt('請輸入自訂科目名稱：');
      if (name && name.trim()) {
        const clean = name.trim();
        if (!categories.includes(clean)) {
          categories.push(clean);
          selectedCategory = clean;
          renderCategoryButtons();
        }
      }
    }

    function parseNaturalLanguage() {
      const text = document.getElementById('ai-input').value.trim();
      if (!text) return;

      const amountMatch = text.match(/(?:hk\$|\$)?\s*(\d+(?:\.\d+)?)/i);
      if (amountMatch) {
        document.getElementById('form-amount').value = parseFloat(amountMatch[1]);
      }

      const lower = text.toLowerCase();
      if (lower.includes('taxi') || lower.includes('的士') || lower.includes('uber') || lower.includes('車')) {
        selectedCategory = '交通';
      } else if (lower.includes('機票') || lower.includes('酒店') || lower.includes('旅行') || lower.includes('外遊')) {
        selectedCategory = '旅遊';
      } else if (lower.includes('食') || lower.includes('dinner') || lower.includes('lunch') || lower.includes('晚餐') || lower.includes('居酒屋')) {
        selectedCategory = '餐飲';
      }
      renderCategoryButtons();

      if (lower.includes('女朋友') || lower.includes('拍拖') || lower.includes('gf')) {
        selectTag('女朋友拍拖');
      } else if (lower.includes('朋友') || lower.includes('fd') || lower.includes('同事')) {
        selectTag('朋友聚餐');
      }

      document.getElementById('form-note').value = text;
    }

    // 儲存並自動同步
    async function saveExpense() {
      const amount = parseFloat(document.getElementById('form-amount').value);
      const date = document.getElementById('form-date').value || new Date().toISOString().split('T')[0];
      const note = document.getElementById('form-note').value.trim() || selectedCategory;

      if (isNaN(amount) || amount <= 0) {
        alert('請輸入有效金額。');
        return;
      }

      const newRecord = {
        id: Date.now().toString(),
        date: date,
        amount: amount,
        category: selectedCategory,
        tag: selectedTag,
        note: note,
        device: getDeviceType()
      };

      if (supabaseClient && currentUser) {
        newRecord.user_id = currentUser.id;
        const { error } = await supabaseClient.from('expenses').insert([newRecord]);
        if (error) {
          alert(`雲端寫入失敗：${error.message}`);
          return;
        }
        await fetchExpensesFromCloud();
      } else {
        expenses.unshift(newRecord);
        localStorage.setItem('omniflow_expenses', JSON.stringify(expenses));
        renderDashboard();
      }

      closeModal();
    }

    async function deleteExpense(id) {
      if (!confirm('確定刪除此筆收支紀錄？')) return;

      if (supabaseClient && currentUser) {
        const { error } = await supabaseClient.from('expenses').delete().eq('id', id);
        if (error) {
          alert(`雲端刪除失敗：${error.message}`);
          return;
        }
        await fetchExpensesFromCloud();
      } else {
        expenses = expenses.filter(e => e.id !== id);
        localStorage.setItem('omniflow_expenses', JSON.stringify(expenses));
        renderDashboard();
      }
    }

    function renderDashboard() {
      const filterTag = document.getElementById('filter-tag').value;
      const filtered = filterTag === 'ALL' ? expenses : expenses.filter(e => e.tag === filterTag);

      const now = new Date();
      const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const thisMonthExpenses = expenses.filter(e => e.date && e.date.startsWith(currentMonthStr));
      const totalThisMonth = thisMonthExpenses.reduce((s, e) => s + Number(e.amount), 0);

      document.getElementById('kpi-current-month').innerText = `HK$ ${Math.round(totalThisMonth).toLocaleString()}`;
      document.getElementById('kpi-total-records').innerText = `${expenses.length} 筆`;

      const gfExpenses = expenses.filter(e => e.tag === '女朋友拍拖').reduce((s, e) => s + Number(e.amount), 0);
      const allTotal = expenses.reduce((s, e) => s + Number(e.amount), 0);
      const gfPct = allTotal > 0 ? Math.round((gfExpenses / allTotal) * 100) : 0;
      document.getElementById('kpi-gf-percentage').innerText = `${gfPct}%`;

      const tbody = document.getElementById('transaction-table-body');
      tbody.innerHTML = '';
      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/50 transition text-xs';
        
        const deviceBadge = item.device === 'mobile'
          ? '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200"><i class="fa-solid fa-mobile-screen mr-1"></i>手機</span>'
          : '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-blue-50 text-blue-700 border border-blue-200"><i class="fa-solid fa-laptop mr-1"></i>電腦</span>';

        tr.innerHTML = `
          <td class="py-3 px-4 text-slate-500 font-mono">${item.date}</td>
          <td class="py-3 px-4 font-semibold text-slate-900">${item.category}</td>
          <td class="py-3 px-4"><span class="px-2 py-0.5 rounded-full text-[11px] bg-slate-100 text-slate-700 font-medium">${item.tag}</span></td>
          <td class="py-3 px-4 text-slate-600">${item.note || ''}</td>
          <td class="py-3 px-4">${deviceBadge}</td>
          <td class="py-3 px-4 text-right font-bold font-mono text-slate-900">${Number(item.amount).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
          <td class="py-3 px-4 text-center">
            <button onclick="deleteExpense('${item.id}')" class="text-slate-400 hover:text-rose-500 transition"><i class="fa-regular fa-trash-can"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      renderCharts();
      renderAttributionAnalysis();
    }

    function renderCharts() {
      const monthlyTotals = {};
      expenses.forEach(e => {
        if (!e.date) return;
        const m = e.date.substring(0, 7);
        monthlyTotals[m] = (monthlyTotals[m] || 0) + Number(e.amount);
      });
      const sortedMonths = Object.keys(monthlyTotals).sort();
      const monthData = sortedMonths.map(m => monthlyTotals[m]);

      if (monthlyChart) monthlyChart.destroy();
      const ctx1 = document.getElementById('monthlyChart').getContext('2d');
      monthlyChart = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: sortedMonths,
          datasets: [{
            label: '月度開支 (HK$)',
            data: monthData,
            backgroundColor: '#16a34a',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } } }
        }
      });

      const tagTotals = {};
      expenses.forEach(e => {
        tagTotals[e.tag] = (tagTotals[e.tag] || 0) + Number(e.amount);
      });

      if (tagChart) tagChart.destroy();
      const ctx2 = document.getElementById('tagChart').getContext('2d');
      tagChart = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: Object.keys(tagTotals),
          datasets: [{
            data: Object.values(tagTotals),
            backgroundColor: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#64748b']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }
        }
      });
    }

    function renderAttributionAnalysis() {
      if (expenses.length === 0) {
        document.getElementById('attribution-analysis').innerText = '尚無足夠數據，請記錄第一筆開支以啟動歸因分析。';
        return;
      }
      const monthlyTotals = {};
      expenses.forEach(e => {
        if (!e.date) return;
        const m = e.date.substring(0, 7);
        monthlyTotals[m] = (monthlyTotals[m] || 0) + Number(e.amount);
      });

      let peakMonth = '';
      let maxVal = -1;
      for (const [m, v] of Object.entries(monthlyTotals)) {
        if (v > maxVal) { maxVal = v; peakMonth = m; }
      }

      const peakExpenses = expenses.filter(e => e.date && e.date.startsWith(peakMonth));
      const peakTagTotals = {};
      peakExpenses.forEach(e => { peakTagTotals[e.tag] = (peakTagTotals[e.tag] || 0) + Number(e.amount); });

      let topTag = '';
      let topTagVal = -1;
      for (const [t, v] of Object.entries(peakTagTotals)) {
        if (v > topTagVal) { topTagVal = v; topTag = t; }
      }

      document.getElementById('attribution-analysis').innerHTML = `
        雲端資料庫分析：開支高峰月份為 <span class="font-bold text-amber-300 font-mono">${peakMonth}</span>，總額達 <span class="font-bold text-white font-mono">HK$ ${Math.round(maxVal).toLocaleString()}</span>。
        主要推動來源為「<span class="font-bold text-white">${topTag}</span>」（佔該月約 ${Math.round((topTagVal / maxVal) * 100)}%）。全裝置同步運作正常。
      `;
    }

    function openModal() {
      document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('expense-modal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('expense-modal').classList.add('hidden');
    }
    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
    }
    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSystem();
    });
  </script>
</body>
</html>
